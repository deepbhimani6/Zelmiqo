<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Category Images</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f4ef;
      color: #171717;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px;
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 24px;
      color: #555;
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 18px;
    }

    figure {
      margin: 0;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
    }

    img {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: #eee;
    }

    figcaption {
      padding: 10px 12px 12px;
      min-height: 44px;
      display: flex;
      align-items: center;
      font-size: 14px;
      line-height: 1.25;
      font-weight: 650;
    }

    @media (max-width: 640px) {
      body {
        padding: 18px;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Category Images</h1>
    <p>Realistic square product photos for the category list.</p>
    <section class="grid" aria-label="Category image gallery">
      <figure><img src="category-images/apple-accessories-img.png" alt="Apple Accessories">
        <figcaption>Apple Accessories</figcaption>
      </figure>
      <figure><img src="category-images/car-care-img.png" alt="Car Care">
        <figcaption>Car Care</figcaption>
      </figure>
      <figure><img src="category-images/consumer-goods-img.png" alt="Consumer Goods">
        <figcaption>Consumer Goods</figcaption>
      </figure>
      <figure><img src="category-images/digital-products-img.png" alt="Digital Products">
        <figcaption>Digital Products</figcaption>
      </figure>
      <figure><img src="category-images/dropship-img.png" alt="Dropship">
        <figcaption>Dropship</figcaption>
      </figure>
      <figure><img src="category-images/hand-picked-img.png" alt="Hand Picked">
        <figcaption>Hand Picked</figcaption>
      </figure>
      <figure><img src="category-images/health-beauty-img.png" alt="Health &amp; Beauty">
        <figcaption>Health &amp; Beauty</figcaption>
      </figure>
      <figure><img src="category-images/home-img.png" alt="Home">
        <figcaption>Home</figcaption>
      </figure>
      <figure><img src="category-images/home-garden-img.png" alt="Home &amp; Garden">
        <figcaption>Home &amp; Garden</figcaption>
      </figure>
      <figure><img src="category-images/kids-img.png" alt="Kids">
        <figcaption>Kids</figcaption>
      </figure>
      <figure><img src="category-images/kitchen-img.png" alt="kitchen">
        <figcaption>kitchen</figcaption>
      </figure>
      <figure><img src="category-images/beauty-personal-care-img.png" alt="Beauty &amp; Personal Care">
        <figcaption>Beauty &amp; Personal Care</figcaption>
      </figure>
      <figure><img src="category-images/fashion-apparel-img.png" alt="Fashion &amp; Apparel">
        <figcaption>Fashion &amp; Apparel</figcaption>
      </figure>
      <figure><img src="category-images/mobile-accessories-img.png" alt="Mobile Accessories">
        <figcaption>Mobile Accessories</figcaption>
      </figure>
      <figure><img src="category-images/electronics-gadgets-img.png" alt="Electronics &amp; Gadgets">
        <figcaption>Electronics &amp; Gadgets</figcaption>
      </figure>
      <figure><img src="category-images/home-kitchen-img.png" alt="Home &amp; Kitchen">
        <figcaption>Home &amp; Kitchen</figcaption>
      </figure>
      <figure><img src="category-images/car-accessories-img.png" alt="Car Accessories">
        <figcaption>Car Accessories</figcaption>
      </figure>
      <figure><img src="category-images/health-fitness-img.png" alt="Health &amp; Fitness">
        <figcaption>Health &amp; Fitness</figcaption>
      </figure>
      <figure><img src="category-images/summer-products-img.png" alt="Summer Products">

      </figure>

    </section>
  </main>
</body>

</html>
